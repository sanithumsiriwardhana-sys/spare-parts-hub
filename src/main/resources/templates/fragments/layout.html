<!DOCTYPE html>
<!--
  Shared page layout. Every staff page extends this fragment.
  Authentication/authorization expressions and routes are intentionally kept
  unchanged; this file only modernizes the shared visual shell.
-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${title} + ' - Spare Parts Hub'">Spare Parts Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app-shell.css}"/>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light app-navbar">
    <a class="navbar-brand" th:href="@{/dashboard}" aria-label="Spare Parts Hub dashboard">
        <img class="brand-logo" th:src="@{/images/spare-parts-hub-logo.svg}" src="/images/spare-parts-hub-logo.svg" alt="Spare Parts Hub"/>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
            aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
            <li class="nav-item" sec:authorize="hasAnyRole('WAREHOUSE_CLERK','SALES_EXEC','ADMIN')">
                <a class="nav-link" th:classappend="${title == 'Inventory'} ? ' active' : ''" th:href="@{/inventory}">Inventory</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyRole('SALES_EXEC','ADMIN')">
                <a class="nav-link" th:classappend="${title == 'Sales / POS'} ? ' active' : ''" th:href="@{/sales}">Sales / POS</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyRole('INVENTORY_SUPERVISOR','ADMIN')">
                <a class="nav-link" th:classappend="${title == 'Urgency Dashboard'} ? ' active' : ''" th:href="@{/stockmonitoring}">Urgency Dashboard</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyRole('SALES_EXEC','INVENTORY_SUPERVISOR','ADMIN')">
                <a class="nav-link" th:href="@{/stockmonitoring/stock-requests}">Stock Requests</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyRole('OPERATIONS_COORDINATOR','ADMIN')">
                <a class="nav-link" th:classappend="${title == 'Warranty / RMA'} ? ' active' : ''" th:href="@{/warranty}">Warranty / RMA</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link"
                   th:classappend="${title == 'Supplier Management' or title == 'Supplier Records' or title == 'Edit Supplier' or title == 'Partnership Requests' or title == 'Restock Requirements' or title == 'Compare Suppliers' or title == 'Create Purchase Order' or title == 'Purchase Orders' or title == 'Purchase Order' or title == 'Receive Supplier Shipment'} ? ' active' : ''"
                   th:href="@{/supplier}">Suppliers</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:classappend="${title == 'Reports'} ? ' active' : ''" th:href="@{/reporting}">Reports</a>
            </li>
        </ul>
        <div class="user-area d-flex align-items-center gap-3">
            <span class="user-name" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-primary btn-sm logout-btn" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>
<main class="container-fluid mt-4" th:replace="${content}"></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
