<!DOCTYPE html>
<!--
  Standalone page - deliberately does NOT extend fragments/layout.html.
  That layout's navbar and sec:authorize checks are written for the
  staff Principal (com.sliit.sparepartshub.security.CustomUserPrincipal)
  and staff routes (/inventory, /sales, etc.) - none of that applies to
  a Supplier principal. Give the supplier portal its own simple layout
  instead of trying to reuse the staff one.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Dashboard - Supplier Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Supplier Portal</span>
    <span class="navbar-text text-light me-3" sec:authentication="name"></span>
    <form th:action="@{/supplier-portal/logout}" method="post" class="d-inline">
        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
    </form>
</nav>
<main class="container mt-4">
    <h2>Welcome</h2>
    <p class="text-muted">
        Placeholder landing page - build out sales-velocity reports,
        restock offer submission, catalog upload, and assigned PO status
        here (UC-06, steps B2-B5).
    </p>
</main>
</body>
</html>
