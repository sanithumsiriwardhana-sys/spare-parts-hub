<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Supplier Portal - Spare Parts Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card p-4 shadow-sm" style="width: 360px;">
        <h4 class="mb-1 text-center">Supplier Portal</h4>
        <p class="text-muted text-center small mb-3">Spare Parts Hub</p>

        <p th:if="${param.error}" class="alert alert-danger py-2">Invalid email or password.</p>
        <p th:if="${param.logout}" class="alert alert-success py-2">You have been logged out.</p>

        <form th:action="@{/supplier-portal/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="username" class="form-control" required autofocus/>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>
</div>
</body>
</html>
