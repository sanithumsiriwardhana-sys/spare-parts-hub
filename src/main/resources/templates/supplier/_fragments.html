<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="assets">
    <link rel="stylesheet" th:href="@{/supplier/supplier-management.css}"/>
</th:block>

<th:block th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <strong>Success.</strong> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Could not complete the action.</strong> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</th:block>

<div th:fragment="subnav(active)" class="supplier-subnav mb-4 no-print">
    <ul class="nav nav-pills flex-column flex-md-row gap-1">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'dashboard'} ? ' active' : ''" th:href="@{/supplier}">Overview</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'suppliers'} ? ' active' : ''" th:href="@{/supplier/records}">Supplier Records</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'partnerships'} ? ' active' : ''" th:href="@{/supplier/partnerships}">Partnership Requests</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'restock'} ? ' active' : ''" th:href="@{/supplier/restock-requirements}">Restock Requirements</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'orders'} ? ' active' : ''" th:href="@{/supplier/purchase-orders}">Purchase Orders</a>
        </li>
    </ul>
</div>

<th:block th:fragment="scripts">
    <script th:src="@{/supplier/supplier-management.js}"></script>
</th:block>

</body>
</html>
