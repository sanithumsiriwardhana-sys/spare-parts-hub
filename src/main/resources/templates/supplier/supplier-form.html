<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(title='Edit Supplier', content=~{::main})}">
<body>
<main class="supplier-page">
    <th:block th:replace="~{supplier/_fragments :: assets}"></th:block>

    <div class="d-flex align-items-center gap-3 mb-4">
        <a class="btn btn-outline-secondary no-print" th:href="@{/supplier/records}">← Back</a>
        <div>
            <div class="page-kicker">Supplier Record</div>
            <h1 class="page-title h2 mb-0">Edit Supplier</h1>
        </div>
    </div>

    <th:block th:replace="~{supplier/_fragments :: subnav('suppliers')}"></th:block>

    <div class="row justify-content-center">
        <div class="col-xl-8">
            <div class="panel-card">
                <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                    <div>
                        <h2 class="h5 fw-bold mb-1" th:text="${supplier.name}">Supplier Name</h2>
                        <p class="text-muted small mb-0">Update business contact details used by procurement.</p>
                    </div>
                    <span class="code-chip" th:text="${'ID ' + supplier.supplierId}">ID 1</span>
                </div>

                <form th:action="@{/supplier/records/{id}(id=${supplier.supplierId})}" method="post">
                    <div class="form-section pt-2">
                        <div class="row g-3">
                            <div class="col-md-5">
                                <label class="form-label" for="supplierCode">Supplier Code</label>
                                <input class="form-control" id="supplierCode" name="supplierCode" maxlength="20"
                                       th:value="${supplier.supplierCode}" placeholder="e.g. SUP-001"/>
                                <div class="form-text">Optional internal supplier reference.</div>
                            </div>
                            <div class="col-md-7">
                                <label class="form-label" for="name">Supplier Name <span class="text-danger">*</span></label>
                                <input class="form-control" id="name" name="name" maxlength="50" required
                                       th:value="${supplier.name}" placeholder="Company or supplier name"/>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="contact">Contact Number <span class="text-danger">*</span></label>
                                <input class="form-control" id="contact" name="contact" maxlength="20" required
                                       th:value="${supplier.contact}" placeholder="Contact number"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="email">Email Address <span class="text-danger">*</span></label>
                                <input class="form-control" id="email" name="email" type="email" maxlength="254" required
                                       th:value="${supplier.email}" placeholder="supplier@example.com"/>
                            </div>
                        </div>
                    </div>

                    <div class="note-box mt-3">
                        Password credentials are not part of Supplier Management. Saving this form will not change the supplier's portal password.
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 no-print">
                        <a class="btn btn-light border" th:href="@{/supplier/records}">Cancel</a>
                        <button class="btn btn-primary" type="submit">Save Supplier Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block th:replace="~{supplier/_fragments :: scripts}"></th:block>
</main>
</body>
</html>
